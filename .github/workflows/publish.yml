name: Publish

# Push to master → check, then build the image and push it to GHCR as the
# commit sha and `latest`. Deploying it is the deployer's business, not this
# repo's: nothing here reaches a server, and the repo has no self-hosted runner.
on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Gate quality before anything is published. A broken build must never
      # become a tag someone can deploy.
      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Install Chromium for the end-to-end tests
        run: bunx playwright install --with-deps chromium

      - name: End-to-end tests
        run: bun run test:e2e

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # A pinnable sha tag for reproducible deploys, plus a moving latest.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

