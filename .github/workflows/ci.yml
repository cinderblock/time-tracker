name: CI

on:
  pull_request:
  push:
    branches-ignore:
      # master is covered by the deploy workflow, which runs the same checks
      # before it builds. Running both would just duplicate the work.
      - master

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test src/

      - name: Build
        run: bun run build
