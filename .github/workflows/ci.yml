name: CI

on:
  pull_request:
  push:
    branches-ignore:
      # master is covered by the deploy workflow, which runs the same checks
      # before it builds. Running both would just duplicate the work.
      - master

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Install Chromium for the end-to-end tests
        run: bunx playwright install --with-deps chromium

      # Builds, then drives the real server through Chromium with a virtual
      # passkey authenticator.
      - name: End-to-end tests
        run: bun run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
