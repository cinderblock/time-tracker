name: Deploy

# Push to master → check, build the image, push it to GHCR, then deploy that
# exact sha via the self-hosted runner on the target box. workflow_dispatch
# re-runs a deploy by hand.
on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Gate quality before anything is published. A broken build must never
      # become a tag someone can deploy.
      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Install Chromium for the end-to-end tests
        run: bunx playwright install --with-deps chromium

      - name: End-to-end tests
        run: bun run test:e2e

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # A pinnable sha tag for reproducible deploys, plus a moving latest.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    # A repo-scoped self-hosted runner on the target box, provisioned by the
    # ops repo (see plans/time-tracker.md, phase 7). Runners are repo-scoped on
    # a personal account, so the ops runner cannot serve this repo.
    runs-on:
      - self-hosted
      - time-tracker
    concurrency:
      group: deploy-host
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Deploy
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          APP_TAG: ${{ github.sha }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # deploy.sh pulls what it needs out of these blobs and materializes
          # the compose env_file. GITHUB_TOKEN rides along unused.
          ALL_SECRETS: ${{ toJSON(secrets) }}
          ALL_VARS: ${{ toJSON(vars) }}
        run: bash deploy.sh
