# An example of running the published image. This repo builds and publishes
# ghcr.io/cinderblock/time-tracker; how and where it runs is up to whoever
# deploys it.
#
# Settings come from ./.env (start from .env.example). Set TIME_TRACKER_TAG to a
# commit sha to run an exact build rather than whatever `latest` is today.
services:
  app:
    image: ghcr.io/cinderblock/time-tracker:${TIME_TRACKER_TAG:-latest}
    container_name: time-tracker
    restart: unless-stopped

    # Host loopback ONLY: a reverse proxy with TLS must be the sole way in.
    # Passkeys and the QuickBooks Web Connector both need HTTPS, and anything
    # that reached the app directly would make X-Forwarded-For untrustworthy.
    ports:
      - "127.0.0.1:${APP_PORT:-9020}:3000"

    env_file:
      - .env

    # Fixed inside the container whatever .env says, so the port mapping and
    # the database's place on the volume can't drift.
    environment:
      - PORT=3000
      - DATABASE_PATH=/data/time-tracker.db

    # The SQLite database. Back this up.
    volumes:
      - ${APP_DATA_DIR:-./data}:/data
